[project]
name = "llm-control-room"
version = "0.1.0"
description = "A self-hosted control plane for LLM apps: gateway, router, observability, releases, bounded agent runs, sandbox and playground. Works fully offline with a built-in mock provider."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
llm-control-room = "llm_control_room.launcher:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_control_room"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/llm_control_room/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
